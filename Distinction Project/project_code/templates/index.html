<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image & Audio Gallery</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 2rem; }
    .item { background: white; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 1rem; margin-bottom: 1.5rem; width: fit-content; }
    img { max-width: 400px; display: block; border-radius: 8px; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Photos and Descriptions</h1>

  {% for img, audio, txt in items %}
    <div class="item">
      <img src="{{ url_for('media', filename=img) }}" alt="{{ img }}">
      <audio controls>
        <source src="{{ url_for('media', filename=audio) }}" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
        <div>
            <h3>Description:</h3>
            <p>{{ txt }}</p>
    </div>
  {% endfor %}
</body>
</html>
